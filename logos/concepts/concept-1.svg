<svg viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SlideIn Venture">
  <!-- Direction: aperture / film gate. The frame is the camera; the orange
       plate is the exposed frame. Sprockets read as film stock. -->
  <g id="icon">
    <rect x="64" y="156" width="200" height="200" rx="36"
          fill="none" stroke="#0A0A0A" stroke-width="16"/>
    <rect x="116" y="208" width="96" height="96" rx="18" fill="#FF6200"/>
    <circle cx="92" cy="206" r="6" fill="#0A0A0A"/>
    <circle cx="92" cy="256" r="6" fill="#0A0A0A"/>
    <circle cx="92" cy="306" r="6" fill="#0A0A0A"/>
  </g>

  <g id="wordmark">
    <text x="316" y="292"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="96" letter-spacing="-3" fill="#0A0A0A">SlideIn<tspan
          font-family="Helvetica, Arial, sans-serif"
          font-size="80" letter-spacing="-1" fill="#FF6200" dx="20">Venture</tspan></text>
  </g>
</svg>
