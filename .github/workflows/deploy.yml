name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SLIDEINVENTURE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Link project
        run: |
          mkdir -p .vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json
          echo "len(VERCEL_TOKEN)=${#VERCEL_TOKEN}"
          echo "len(VERCEL_ORG_ID)=${#VERCEL_ORG_ID}"
          echo "len(VERCEL_PROJECT_ID)=${#VERCEL_PROJECT_ID}"
          echo "hash(VERCEL_ORG_ID)=$(printf %s "$VERCEL_ORG_ID" | sha256sum | cut -c1-8)"
          echo "hash(VERCEL_PROJECT_ID)=$(printf %s "$VERCEL_PROJECT_ID" | sha256sum | cut -c1-8)"

      - name: Deploy to Vercel
        run: |
          npx --yes vercel@latest deploy --token $VERCEL_TOKEN --prod --yes
