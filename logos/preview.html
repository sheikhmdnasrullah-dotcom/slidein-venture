<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Preview — Concepts</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 2rem;
    transition: background-color 0.3s, color 0.3s;
  }
  /* Rule 2: no pure #FFFFFF / #000000 anywhere, preview chrome included. */
  body.light { background: #F2F1ED; color: #2B2A27; }
  body.dark  { background: #161513; color: #E8E6E1; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
  }
  h1 { font-size: 1.5rem; font-weight: 600; }
  h2 { font-size: 1.1rem; font-weight: 600; margin: 3rem 0 1.25rem; }
  .toggle {
    padding: 0.5rem 1rem;
    border: 1px solid currentColor;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 0.875rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 1.5rem;
  }
  .card {
    border: 1px solid rgba(128, 128, 128, 0.3);
    border-radius: 12px;
    overflow: hidden;
  }
  .card-img {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    min-height: 240px;
  }
  body.light .card-img { background: #FAFAF8; }
  body.dark  .card-img { background: #221F1C; }
  .card-img img { max-width: 100%; max-height: 200px; }
  .card-label {
    padding: 0.75rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    border-top: 1px solid rgba(128, 128, 128, 0.3);
  }
  body.light .card-label { background: #F2F1ED; }
  body.dark  .card-label { background: #1C1A18; }
  .strip { display: flex; gap: 2.5rem; flex-wrap: wrap; align-items: end; }
  .strip .col { display: flex; flex-direction: column; align-items: center; gap: .5rem; }
  .strip .row { display: flex; gap: 1rem; align-items: end; }
  .cap { font-size: .75rem; opacity: .6; text-align: center; }
</style>
</head>
<body class="light">
  <div class="header">
    <h1>Logo Preview — Concepts</h1>
    <button class="toggle" onclick="document.body.classList.toggle('dark'); document.body.classList.toggle('light'); this.textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';">🌙 Dark</button>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-img"><img src="concepts/concept-1.svg" alt="concept-1"></div>
      <div class="card-label">concept-1 — aperture / film gate</div>
    </div>
    <div class="card">
      <div class="card-img"><img src="concepts/concept-2.svg" alt="concept-2"></div>
      <div class="card-label">concept-2 — signal / pipeline</div>
    </div>
    <div class="card">
      <div class="card-img"><img src="concepts/concept-3.svg" alt="concept-3"></div>
      <div class="card-label">concept-3 — monogram S-slide</div>
    </div>
    <div class="card">
      <div class="card-img"><img src="concepts/concept-4.svg" alt="concept-4"></div>
      <div class="card-label">concept-4 — interface framing</div>
    </div>
  </div>

  <h2>Favicon Size Check</h2>
  <div class="strip">
    <div class="col">
      <div class="cap">concept-1 icon</div>
      <div class="row">
        <div><img src="concepts/concept-1-icon.svg" width="64" height="64"><div class="cap">64</div></div>
        <div><img src="concepts/concept-1-icon.svg" width="32" height="32"><div class="cap">32</div></div>
        <div><img src="concepts/concept-1-icon.svg" width="16" height="16"><div class="cap">16</div></div>
      </div>
    </div>
    <div class="col">
      <div class="cap">concept-2 icon</div>
      <div class="row">
        <div><img src="concepts/concept-2-icon.svg" width="64" height="64"><div class="cap">64</div></div>
        <div><img src="concepts/concept-2-icon.svg" width="32" height="32"><div class="cap">32</div></div>
        <div><img src="concepts/concept-2-icon.svg" width="16" height="16"><div class="cap">16</div></div>
      </div>
    </div>
    <div class="col">
      <div class="cap">concept-3 icon</div>
      <div class="row">
        <div><img src="concepts/concept-3-icon.svg" width="64" height="64"><div class="cap">64</div></div>
        <div><img src="concepts/concept-3-icon.svg" width="32" height="32"><div class="cap">32</div></div>
        <div><img src="concepts/concept-3-icon.svg" width="16" height="16"><div class="cap">16</div></div>
      </div>
    </div>
    <div class="col">
      <div class="cap">concept-4 icon</div>
      <div class="row">
        <div><img src="concepts/concept-4-icon.svg" width="64" height="64"><div class="cap">64</div></div>
        <div><img src="concepts/concept-4-icon.svg" width="32" height="32"><div class="cap">32</div></div>
        <div><img src="concepts/concept-4-icon.svg" width="16" height="16"><div class="cap">16</div></div>
      </div>
    </div>
  </div>
</body>
</html>
