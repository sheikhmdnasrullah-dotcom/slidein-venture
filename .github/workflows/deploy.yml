name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Vercel config
        run: |
          mkdir -p .vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID_SLIDEINVENTURE }}"}' > .vercel/project.json

      - name: Deploy to Vercel
        run: npx --yes vercel@latest --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
