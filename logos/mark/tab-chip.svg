<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SlideIn Venture">
  <title>SlideIn Venture</title>
  <!--
    TAB CHIP: the browser and OS icon.

    There is no letterform here, on purpose. The identity is the wordmark
    (see components/Brand/Logo.tsx); the tab icon is the brand colour as a
    pure field, which is the one thing that still reads at 16px in a crowded
    tab strip. The drawn two-tone S that used to live here was removed.

    FF6200 is the brand orange converted exactly. A favicon has no CSS
    cascade to read a token from, so this is the one file in the repo where
    a literal brand hex is correct rather than a bug.

    The 1px inset and rx 7 give the chip a visible silhouette against both
    light and dark browser chrome. app/apple-icon.png is generated FULL
    BLEED instead, because iOS applies its own squircle mask and would
    otherwise round an already rounded corner twice.
  -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#FF6200"/>
</svg>
