<svg viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SlideIn Venture">
  <!-- Direction: monogram. A true two-tone S — ink on the entry curve, brand
       orange on the exit curve, so the letter reads as something sliding
       through. Solid weight keeps it legible at favicon sizes.
       (v2: the first pass used two bars + a straight diagonal, which is
       geometrically a Z, not an S.) -->
  <g id="icon" fill="none" stroke-width="36" stroke-linecap="round">
    <path stroke="#0A0A0A"
          d="M224 198 C224 168 196 152 164 152 C130 152 104 172 104 200
             C104 230 132 246 164 252"/>
    <path stroke="#FF6200"
          d="M164 252 C198 258 224 274 224 302 C224 332 196 352 164 352
             C132 352 104 334 104 306"/>
  </g>

  <g id="wordmark">
    <text x="316" y="292"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="96" letter-spacing="-3" fill="#0A0A0A">SlideIn<tspan
          letter-spacing="-3" fill="#FF6200" dx="22">Venture</tspan></text>
  </g>
</svg>
